runtime:
  local_store_target: user

task_runs:
  enabled: true
  # Durable Run creation requires an explicit Host decision to persist
  # bounded goal/resume material as plaintext in RuntimeStore.
  plaintext_payloads_enabled: false

git:
  enabled: true
  executable: git
  minimum_version: 2.26.0
  worktree_root: agent_outputs/git_worktrees
  trusted_metadata_roots: []
  allowed_remote_schemes: [https, ssh]
  allow_file_remotes: false
  inherit_credential_helpers: true
  inherit_ssh_agent: true
  protect_git_metadata: true

modules:
  manifest_paths:
    - modules/pty/module.yaml
    - modules/agentvfs/module.yaml
  trusted_modules:
    - agent-libos-pty:v0:2bafedf56f29af97ab21d6bf93eda96b68e098f86cd6cb5e55c405cc71111181:3781eb9c417a1e399bce8a9f42b8c5557d40f817d49d6ae2694b67c43dbd7b7c
    - agent-libos-agentvfs:v0:4b29d1f177c990d0cf46d6af0b261061a1549e6a3789fb5443c56f1c7d3afc92:15598fd8dcddc72e87cc01cfbba62283f42f886be2169144e3600cb776053ed7

data_flow:
  default_trust_level: untrusted
  default_max_sensitivity: normal
  sink_rules: []
  operation_minimum_integrity: {}
